<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
 rel="stylesheet"><!-- font monsserat -->

    <link rel="stylesheet" href="style.css">

    <script src="https://kit.fontawesome.com/a17cb46a55.js"></script>
</head>
<body id="contact_body">
    <div id="contact_content">
    
        <div id="contact_container">
            <form action="https://api.web3forms.com/submit" method="POST" id="contact_left">
                <div id="contact_title">
                    <h2>Contactati-ne!</h2>
                    <hr>
                </div>
                <input type="hidden" name="access_key" value="edd9e256-502e-43eb-9036-e0d5edc6284a">


                <div class="elem_contact" id="randnume">
                    <label for="nume">Nume client</label>

                    <div class="input_div">
                        <input required type="text" id="nume" name="nume">
                    </div>
                    <label for="numecomp">Nume companie</label>

                    <div class="input_div">
                        <input required type="text" id="numecomp" name="numecomp">
                    </div>
                </div>

                <div class="elem_contact">
                    <label for="nrtel">Nr. de telefon</label>

                    <div class="input_div">
                        <input required type="tel" pattern="[0-9]{10}" id="nrtel" 
                        name="nrtel" placeholder="0765123456">
                    </div>
                </div>

                <div class="elem_contact">
                    <label for="email">Adresa de email</label>

                    <div class="input_div">
                        <input required type="email" id="email" name="email">
                    </div>
                </div>

                <div class="elem_contact">
                    <label for="mesaj">Mesaj</label>

                    <div class="input_div">
                        <textarea id="mesaj" name="mesaj" required></textarea>
                    </div>
                </div>

                <p class="text_avertizare" id="errorMessage" style="display: none;">Toate casutele trebuiesc completate inainte de a apasa "Trimite"</p>
                <button type="submit">Trimite</button>
            </form>

            <div id="contact_right">

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
